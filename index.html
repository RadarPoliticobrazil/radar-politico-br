<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Político BR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1F1F1F;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            fill: #4f46e5;
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFFFFF;
            letter-spacing: 1px;
            font-weight: 700;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: #1E1E1E;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #1F1F1F;
            border-top: 1px solid #333;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Ícone de Radar Moderno -->
            <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
        </div>
        <h1>Radar Político BR</h1>
    </header>

    <main>
        <div class="card">
            <h2>Bem-vindo ao App</h2>
            <p style="margin-top: 10px; color: #b0b0b0;">As pesquisas e atualizações serão carregadas aqui em breve.</p>
        </div>
    </main>

    <footer>
        &copy; 2026 Radar Político BR - Todos os direitos reservados.
    </footer>

    <script>
        // Carregamento automático dos dados
        fetch('pesquisas.json')
            .then(response => response.json())
            .then(data => {
                console.log("Dados carregados com sucesso:", data);
            })
            .catch(error => console.log("Aguardando arquivo de dados..."));
    </script>
</body>
</html>
